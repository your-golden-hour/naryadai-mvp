services:
  db:
    image: postgres:15-alpine
    container_name: naryadai-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: naryadai
    ports:
      - "5432:5432"
    volumes:
      - naryadai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d naryadai"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  naryadai_pgdata:
